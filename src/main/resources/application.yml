spring:
  application:
    name: order-management

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/centrika_orders}
    username: ${DB_USER:centrika}
    password: ${DB_PASSWORD:centrika}
    hikari:
     
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
   
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

logging:
  level:
    rw.centrika.orders: INFO
    org.hibernate.SQL: DEBUG
