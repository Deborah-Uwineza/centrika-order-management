services:
  db:
    image: postgres:15-alpine
    container_name: centrika-orders-db
    environment:
      POSTGRES_DB: centrika_orders
      POSTGRES_USER: centrika
      POSTGRES_PASSWORD: centrika
    ports:
      - "5432:5432"
    volumes:
     
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centrika -d centrika_orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: centrika-orders-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/centrika_orders
      DB_USER: centrika
      DB_PASSWORD: centrika
    ports:
      - "8080:8080"

volumes:
  db-data:
